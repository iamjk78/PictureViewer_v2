name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # macOS: sestavení + testy. Objective-C++ (Dock menu, snímek obrazovky,
  # schránka), getattrlistbulk a symlinkové větve testů se jinak nikdy
  # nepřeloží ani nespustí — vývoj běží na macOS, ale CI to dřív nehlídalo.
  build-and-test-macos:
    name: Build & test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.1'
          modules: 'qtpdf qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # modální dialog v testu by jinak držel job až 6 hodin
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Qt 6 včetně modulu PDF (qtpdf). Concurrent/Network/Widgets/Test jsou
      # součástí základní instalace.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.1'
          modules: 'qtpdf qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # ctest na Windows výstup Qt testů nezachytí — při selhání je spustit
      # napřímo (s argumentem -o MainWindow neobnovuje poslední složku, takže
      # testy restoreLastFolder_*/openFolder_* tu selžou jen kvůli tomu — ignorovat) a vypsat jen to,
      # co selhalo.
      - name: Show failing tests
        if: failure()
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          foreach ($exe in (Get-ChildItem build -Recurse -Filter "picture_viewer_*tests.exe")) {
            Write-Host "=== $($exe.Name)"
            $report = "$($exe.BaseName).txt"
            & $exe.FullName -o "$report,txt" | Out-Null
            Write-Host "exit code: $LASTEXITCODE"
            if (Test-Path $report) {
              $lines = Get-Content $report
              $show = $false
              foreach ($l in $lines) {
                if ($l -match "^FAIL") { $show = $true } elseif ($l -match "^(PASS|Totals|QWARN)") { $show = $false }
                if ($show -or $l -match "^Totals") { $l }
              }
            }
          }

      # Zkopírovat exe + Qt DLL pomocí windeployqt + MSVC runtime DLL, zabalit do ZIP.
      - name: Package
        shell: pwsh
        run: |
          $deployDir = "dist\PictureViewer"
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null
          Copy-Item "build\Release\PictureViewer.exe" "$deployDir\"

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations `
              --no-system-d3d-compiler "$deployDir\PictureViewer.exe"

          # Zkopírovat všechny MSVC runtime DLL z VC Redist CRT adresáře.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $crtDir  = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\*CRT" |
                       Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "CRT dir: $crtDir"
          Get-ChildItem "$crtDir\*.dll" | ForEach-Object { Copy-Item $_.FullName "$deployDir\" }

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PictureViewer-Windows
          path: dist\PictureViewer
          retention-days: 30
