name: Release

# Publikace nové verze: push tagu vX.Y (např. v0.16) vytvoří GitHub Release
# s Windows instalátorem, nepodepsaným macOS .dmg (arm64) a SHA256SUMS.txt.
# Na tento release se odkazuje funkce automatické aktualizace v aplikaci
# (UpdateChecker; hledá jen soubor .exe, .dmg se aktualizuje ručně).
#
# Ruční spuštění (workflow_dispatch) vyzkouší jen sestavení macOS .dmg a nic
# nepublikuje — slouží k ověření balení bez nutnosti vydat tag.

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

# Build běží s právy jen pro čtení; zápisový token má až samostatný job, který
# jen publikuje hotové soubory (nepřipnuté / třetí strany v buildu ho nedostanou).
permissions:
  contents: read

jobs:
  build-windows:
    name: Build installer
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verze z tagu (v0.16 → 0.16) + PŘESNÁ shoda s project(VERSION …) v CMakeLists.txt.
      # (Dřív stačil podřetězec: tag v0.3 prošel proti verzi 0.34.)
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+(\.\d+)?)$') {
            Write-Error "Tag $env:GITHUB_REF_NAME is not in the form vX.Y[.Z]."
            exit 1
          }
          $version = $Matches[1]
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(PictureViewer VERSION ([0-9.]+)') {
            Write-Error "Cannot find project VERSION in CMakeLists.txt."
            exit 1
          }
          $projectVersion = $Matches[1]
          if ($projectVersion -ne $version) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match project VERSION $projectVersion in CMakeLists.txt. Bump the version and re-tag."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.1'
          modules: 'qtpdf qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $deployDir = "dist\PictureViewer"
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null
          Copy-Item "build\Release\PictureViewer.exe" "$deployDir\"

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations `
              --no-system-d3d-compiler "$deployDir\PictureViewer.exe"

          # Zkopírovat všechny MSVC runtime DLL z VC Redist CRT adresáře.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $crtDir  = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\*CRT" |
                       Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem "$crtDir\*.dll" | ForEach-Object { Copy-Item $_.FullName "$deployDir\" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              /DAppVersion=$env:VERSION `
              /DSourceDir=..\dist\PictureViewer `
              installer\setup.iss
          Move-Item "installer\output\PictureViewer-Setup.exe" `
                    "PictureViewer-Setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-assets
          path: PictureViewer-Setup.exe
          if-no-files-found: error

  # Nepodepsané .dmg pro Apple Silicon (runner macos-latest je arm64). Qt z
  # Homebrew (aqt Qt 6.8.1 na nejnovějším SDK nelinkuje — viz ci.yml).
  build-macos:
    name: Build macOS dmg
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          version=$(sed -n 's/^project(PictureViewer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "Cannot find project VERSION in CMakeLists.txt." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project VERSION $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        run: brew install qt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # macdeployqt sám nenasadí plugin SVG (Homebrew ho má v samostatném
      # balíčku qtsvg) — proto se vloží do bundlu předem a -libpath ukáže na
      # frameworky, které potřebuje. Bez toho by se .svg v .dmg neotevřely.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app=build/PictureViewer.app
          mkdir -p "$app/Contents/PlugIns/imageformats"
          cp "$(brew --prefix)/share/qt/plugins/imageformats/libqsvg.dylib" \
             "$app/Contents/PlugIns/imageformats/"
          "$(brew --prefix qt)/bin/macdeployqt" "$app" -libpath="$(brew --prefix)/lib"

          # Bundle musí být soběstačný: žádná závislost na Homebrew (řádek s vlastním
          # install name knihovny, který otool vypisuje mezi závislostmi, se přeskočí).
          bad=0
          while IFS= read -r f; do
            if otool -L "$f" 2>/dev/null | tail -n +2 | grep -v "/$(basename "$f") " \
                 | grep -qE '/opt/homebrew|/usr/local'; then
              echo "External dependency in $f"; otool -L "$f"; bad=1
            fi
          done < <(find "$app" -type f \( -name '*.dylib' -o -perm -111 \))
          [ "$bad" -eq 0 ] || exit 1
          ls "$app/Contents/Frameworks" | grep -q QtSvg
          codesign --verify --deep --strict "$app"

          mkdir dmg-root
          cp -R "$app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "PictureViewer $VERSION" -srcfolder dmg-root \
              -ov -format UDZO "PictureViewer-$VERSION-macOS-arm64.dmg"

      - name: Upload dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-assets
          path: PictureViewer-*-macOS-arm64.dmg
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-assets'
          merge-multiple: true
          path: assets

      # Součty se počítají až tady nad přesně těmi soubory, které se publikují.
      - name: Generate checksums
        working-directory: assets
        run: |
          sha256sum PictureViewer-Setup.exe PictureViewer-*-macOS-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              assets/PictureViewer-Setup.exe assets/PictureViewer-*-macOS-arm64.dmg \
              assets/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "PictureViewer $VERSION" \
              --notes "macOS: the .dmg is for Apple Silicon and is not signed. On first launch right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/PictureViewer.app\`." \
              --generate-notes
